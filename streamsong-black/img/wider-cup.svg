<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d77a"/><stop offset=".55" stop-color="#d9a634"/><stop offset="1" stop-color="#a8771c"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17345a"/><stop offset="1" stop-color="#0b1b2b"/>
    </linearGradient>
    <path id="arcTop" d="M 92 300 A 208 208 0 0 1 508 300"/>
    <path id="arcBot" d="M 68 300 A 232 232 0 0 0 532 300"/>
  </defs>
  <!-- outer rings -->
  <circle cx="300" cy="300" r="290" fill="url(#gold)"/>
  <circle cx="300" cy="300" r="272" fill="url(#navy)"/>
  <circle cx="300" cy="300" r="262" fill="none" stroke="url(#gold)" stroke-width="3"/>
  <circle cx="300" cy="300" r="160" fill="#0f2a49" stroke="url(#gold)" stroke-width="5"/>
  <!-- arc lettering -->
  <text font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="700" fill="url(#gold)" letter-spacing="10">
    <textPath href="#arcTop" startOffset="50%" text-anchor="middle">WIDER CUP</textPath>
  </text>
  <text font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#f2e6c4" letter-spacing="8">
    <textPath href="#arcBot" startOffset="50%" text-anchor="middle">STREAMSONG · 2026</textPath>
  </text>
  <!-- side diamonds -->
  <path d="M 46 300 l 12 -12 l 12 12 l -12 12 z" fill="url(#gold)"/>
  <path d="M 530 300 l 12 -12 l 12 12 l -12 12 z" fill="url(#gold)"/>
  <!-- centre: green, flag and crossed clubs -->
  <ellipse cx="300" cy="372" rx="118" ry="26" fill="#2f8a4e"/>
  <ellipse cx="300" cy="368" rx="104" ry="18" fill="#3fa660"/>
  <!-- crossed clubs -->
  <g stroke-linecap="round">
    <line x1="215" y1="205" x2="372" y2="362" stroke="#e9edf2" stroke-width="7"/>
    <path d="M 372 362 q 18 6 30 -2 q 4 -10 -8 -14 z" fill="#e9edf2"/>
    <line x1="385" y1="205" x2="228" y2="362" stroke="#e9edf2" stroke-width="7"/>
    <path d="M 228 362 q -18 6 -30 -2 q -4 -10 8 -14 z" fill="#e9edf2"/>
    <rect x="207" y="196" width="18" height="34" rx="6" transform="rotate(-45 216 213)" fill="url(#gold)"/>
    <rect x="375" y="196" width="18" height="34" rx="6" transform="rotate(45 384 213)" fill="url(#gold)"/>
  </g>
  <!-- flagstick -->
  <line x1="300" y1="178" x2="300" y2="362" stroke="#f2e6c4" stroke-width="5"/>
  <path d="M 303 180 L 360 198 L 303 216 Z" fill="#c8302b"/>
  <!-- ball -->
  <circle cx="334" cy="352" r="13" fill="#ffffff" stroke="#c9d2dc" stroke-width="2"/>
  <!-- EST banner -->
  <path d="M 196 404 L 404 404 L 390 428 L 404 452 L 196 452 L 210 428 Z" fill="url(#gold)"/>
  <text x="300" y="439" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#0b1b2b" letter-spacing="4">EST. 2020</text>
</svg>
